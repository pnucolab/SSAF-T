[build-system]
requires = [
    "meson-python>=0.15.0",
    "meson>=1.2.0",
    "ninja",
    "numpy>=1.26.4,<=2.0.2",
]
build-backend = "mesonpy"

[project]
name = "ssaft"
version = "0.1.0"
description = "SSAF-T — Spatial Segmentation-free Agentic Framework for Transcriptomics"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
keywords = ["spatial-transcriptomics", "cell-type", "kde", "vector-field"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Lower bounds follow a virtual environment verified to be conflict-free.
dependencies = [
    "numpy>=1.26.4,<=2.0.2",       # upper bound kept for numba / C-extension compatibility
    "scipy>=1.16.3",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scikit-image>=0.25.2",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "opencv-python-headless>=4.12.0.88",    # cv2 — Otsu thresholding (_analysis.py); headless = no libGL needed on servers
    "zarr>=3.1.6",
    "numcodecs>=0.15.1",
    "dask[array]>=2026.1.1",
    "xarray>=2026.4.0",            # image storage in _dataset.py
    "python-igraph>=1.0.0",
    "leidenalg>=0.11.0",
    "psutil>=7.1.3",
    "packaging>=25.0",
    "tqdm>=4.67.1",
    "anndata>=0.12.6",
    "scanpy>=1.11.5",
    "spatialdata>=0.7.3",
    "spatialdata-io>=0.5.1",       # platform raw loaders (workflow Step 1)
    "spatialdata-plot>=0.2.13",    # .pl plotting accessor used by _dataset.py
    "pillow>=10.0.0",              # PIL.Image in _dataset.py
    "tifffile>=2024.1.30",         # _io/_loaders.py
    "requests>=2.31.0",            # ontology server calls in _panel.py
    # tensorstore backs the vf_normalized write path in _count.py. Its import there is wrapped in
    # try/except and falls back to zarr-python, so a missing install costs throughput silently
    # rather than raising — declare it so that never happens by accident.
    "tensorstore>=0.1.60",
]

[project.optional-dependencies]
# GPU acceleration: downsample_vector (KDE) + Leiden clustering (rapids-singlecell) + map_celltypes_gpu.
# Note: wheels are CUDA-version specific and are not on plain PyPI. Extra indexes are required:
#   uv pip install '.[gpu]' --index-strategy unsafe-best-match \
#       --extra-index-url https://pypi.nvidia.com \
#       --extra-index-url https://download.pytorch.org/whl/cu128
#   (CUDA 13 here. cuml/cugraph/cuvs are listed explicitly because rapids-singlecell
#    does not pull them in as hard dependencies.)
#   rapids-singlecell and cuml must be kept in step, and which pair is reachable depends on the
#   interpreter, so the two branches are spelled out rather than left to resolver luck.
#   cuml/cugraph/cuvs ship on one RAPIDS release cycle and are always pinned together.
gpu = [
    # Python 3.11 — the tested configuration. 0.14+ requires >=3.12, so 0.13.4 is the ceiling here;
    # it imports cuml.thirdparty_adapters.check_array, which cuml 26.6 moved to
    # cuml.internals.validation. An unbounded cuml floor therefore installs cleanly and then dies at
    # `import rapids_singlecell`. 26.2 is verified good; 26.4 is untested and so excluded.
    "rapids-singlecell>=0.13.4,<0.14; python_version < '3.12'",
    "cuml-cu13>=26.2.0,<26.4.0; python_version < '3.12'",
    "cugraph-cu13>=26.2.0,<26.4.0; python_version < '3.12'",
    "cuvs-cu13>=26.2.0,<26.4.0; python_version < '3.12'",
    # Python 3.12+ — current rapids-singlecell tracks the current cuml API, so cuml is left open.
    # NOT part of the tested matrix; 3.11 is what CI and the notebooks are run against.
    "rapids-singlecell>=0.16.1; python_version >= '3.12'",
    "cuml-cu13>=26.2.0; python_version >= '3.12'",
    "cugraph-cu13>=26.2.0; python_version >= '3.12'",
    "cuvs-cu13>=26.2.0; python_version >= '3.12'",
    "cupy-cuda13x>=14.0.1",
    "torch>=2.10.0",
    "triton>=3.6.0",
]
dev = [
    "pytest>=6.0",
    "build",
]

[tool.meson-python.args]
setup = ["-Dbuildtype=release"]
